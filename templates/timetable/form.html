{% extends 'base.html' %}
{% block title %}Schedule Timetable Period{% endblock %}
{% block content %}
<div class="page-header">
    <h2>➕ Schedule New Timetable Period</h2>
    <p class="text-muted">Automatic conflict detection checks teacher availability and room allocation</p>
</div>
<div class="card card-narrow">
    <div class="card-body">
        <form method="POST" action="{{ url_for('timetable.new_period') }}">
            <div class="form-grid-2">
                <div class="form-group">
                    <label>Class Name *</label>
                    <input type="text" name="class_name" class="form-control" value="CS-101" required>
                </div>
                <div class="form-group">
                    <label>Section *</label>
                    <input type="text" name="section" class="form-control" value="A" required>
                </div>
            </div>
            <div class="form-grid-3">
                <div class="form-group">
                    <label>Day of Week *</label>
                    <select name="day" class="form-control" required>
                        <option value="Monday">Monday</option>
                        <option value="Tuesday">Tuesday</option>
                        <option value="Wednesday">Wednesday</option>
                        <option value="Thursday">Thursday</option>
                        <option value="Friday">Friday</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Start Time * (HH:MM)</label>
                    <input type="time" name="start_time" class="form-control" value="09:00" required>
                </div>
                <div class="form-group">
                    <label>End Time * (HH:MM)</label>
                    <input type="time" name="end_time" class="form-control" value="10:00" required>
                </div>
            </div>
            <div class="form-group">
                <label>Subject *</label>
                <select name="subject_id" class="form-control" required>
                    <option value="">-- Select Subject --</option>
                    {% for s in subjects %}
                    <option value="{{ s.id }}">{{ s.name }} ({{ s.code }})</option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label>Assigned Teacher / Faculty *</label>
                <select name="teacher_id" class="form-control" required>
                    <option value="">-- Select Teacher --</option>
                    {% for t in teachers %}
                    <option value="{{ t.id }}">{{ t.full_name }} ({{ t.department }})</option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label>Room / Lab Number *</label>
                <input type="text" name="room" class="form-control" value="Room 101" required>
            </div>
            <div class="form-actions">
                <button type="submit" class="btn btn-primary">Schedule Period</button>
                <a href="{{ url_for('timetable.index') }}" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
