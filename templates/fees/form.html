{% extends 'base.html' %}
{% block title %}Generate Fee Invoice{% endblock %}
{% block content %}
<div class="page-header">
    <h2>➕ Generate Student Fee Invoice</h2>
</div>
<div class="card card-narrow">
    <div class="card-body">
        <form method="POST" action="{{ url_for('fees.new_fee') }}">
            <div class="form-group">
                <label>Select Student *</label>
                <select name="student_id" class="form-control" required>
                    <option value="">-- Choose Student --</option>
                    {% for s in students %}
                    <option value="{{ s.id }}">{{ s.full_name }} ({{ s.student_id }} - {{ s.class_name }})</option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label>Invoice Title *</label>
                <input type="text" name="title" class="form-control" placeholder="Fall 2026 Tuition & Facility Fee" required>
            </div>
            <div class="form-grid-2">
                <div class="form-group">
                    <label>Gross Amount ($) *</label>
                    <input type="number" name="total_amount" class="form-control" value="2500" step="0.01" required>
                </div>
                <div class="form-group">
                    <label>Discount / Scholarship ($)</label>
                    <input type="number" name="discount_amount" class="form-control" value="0" step="0.01">
                </div>
            </div>
            <div class="form-group">
                <label>Payment Due Date *</label>
                <input type="date" name="due_date" class="form-control" value="2026-09-30" required>
            </div>
            <div class="form-actions">
                <button type="submit" class="btn btn-primary">Create Invoice</button>
                <a href="{{ url_for('fees.index') }}" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
