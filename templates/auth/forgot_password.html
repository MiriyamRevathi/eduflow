<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <title>Forgot Password - EduFlow ERP</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/forms.css') }}">
</head>
<body class="auth-page">
    <div class="auth-card-container">
        <div class="auth-card">
            <div class="auth-header">
                <div class="auth-logo">🔒</div>
                <h2>Password Recovery</h2>
                <p>Enter your email to receive reset instructions</p>
            </div>

            <form method="POST" action="{{ url_for('auth.forgot_password') }}" class="auth-form">
                <div class="form-group">
                    <label for="email">Registered Email Address</label>
                    <input type="email" id="email" name="email" class="form-control" placeholder="user@eduflow.local" required autofocus>
                </div>
                <button type="submit" class="btn btn-primary btn-block btn-lg">Send Recovery Link</button>
            </form>
            <div class="m-t-20 text-center">
                <a href="{{ url_for('auth.login') }}" class="small-link">← Back to Login</a>
            </div>
        </div>
    </div>
</body>
</html>
